server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so mapped host ports (e.g. :3005) are preserved.
    absolute_redirect off;

    location / {
        # Serve nested Astro routes without requiring a trailing-slash redirect.
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
